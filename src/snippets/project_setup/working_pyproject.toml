[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sparta"
version = "0.1.0"
description = "Sparta project for STIX data processing and ArangoDB integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # HTTP and API
    "aiohttp>=3.11.11",
    "requests>=2.32.3",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    
    # Data processing
    "pydantic>=2.10.5",
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0,<2.0.0",
    
    # Database
    "python-arango>=7.5.0",
    
    # PDF processing
    "PyMuPDF>=1.22.0",  # fitz
    # "camelot-py>=0.11.0",
    
    # NLP and text processing
    "spacy>=3.8.4",
    "tiktoken>=0.8.0",
    
    # LLM integration
    "openai>=1.60.0",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "tqdm>=4.65.0",
    "json-repair>=0.35.0",

    # Local dependencies
    "text-toolz @ file:///Users/robert/Desktop/dev/projects/experiments/text_toolz",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0", 
    "mypy>=1.14.1", 
    "pytest>=8.0.2",
    "pytest-asyncio>=0.21.0",
]

# Define entry points for command-line scripts
[project.scripts]
sparta-stix-import = "sparta.stix.importer:main"
sparta-api = "sparta.api.main:start"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparta*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py310"]  # Updated to match requires-python

[tool.mypy]
python_version = "3.10"  # Updated to match requires-python
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Add pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"