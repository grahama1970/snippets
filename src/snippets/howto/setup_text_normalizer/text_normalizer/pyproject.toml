[build-system]
requires = ["setuptools>=68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text_normalizer"
version = "0.1.0"
description = "Text normalization utilities"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.2",
    "nltk",
    "pydantic>=2.0",
    "emoji>=2.14.1",
    "better-profanity>=0.7.0",
    "langdetect>=1.0.9",
]

[tool.setuptools]
package-dir = {"" = "src"} 