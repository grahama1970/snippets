name: Monocle Man Netlify Preview

on:
  push:
    branches:
      - preview-monocle-man-netlify
    paths:
      - "monocle-man-site/**"
      - ".github/workflows/monocle-man-netlify-preview.yml"
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy an anonymous Netlify preview
        working-directory: monocle-man-site
        run: npx --yes netlify-cli@latest deploy --dir=. --allow-anonymous --prod --json | tee netlify-deploy.json
      - name: Preserve deployment result
        uses: actions/upload-artifact@v4
        with:
          name: monocle-man-netlify-deploy
          path: monocle-man-site/netlify-deploy.json
          retention-days: 1
