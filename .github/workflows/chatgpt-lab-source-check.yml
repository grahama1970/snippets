name: ChatGPT-Lab Source Check

on:
  push:
    branches:
      - chatgpt-lab
    paths:
      - "chatgpt-lab/**"
      - ".github/workflows/chatgpt-lab-source-check.yml"
  pull_request:
    paths:
      - "chatgpt-lab/**"
      - ".github/workflows/chatgpt-lab-source-check.yml"
  workflow_dispatch:

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate control plane
        run: |
          python chatgpt-lab/scripts/validate_control_plane.py > chatgpt-lab/control-plane-validation.json
          cat chatgpt-lab/control-plane-validation.json

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-lab-control-plane-validation
          path: chatgpt-lab/control-plane-validation.json
          if-no-files-found: warn
          retention-days: 14
